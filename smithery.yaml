# Smithery configuration for Prefeitura PE Recife: NFS-e (Nota Fiscal Eletrônica de Serviços)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pref_pe_recife_nfs

name: pref_pe_recife_nfs-mcp
displayName: "Prefeitura PE Recife: NFS-e (Nota Fiscal Eletrônica de Serviços)"
description: >
  Prefeitura PE Recife: NFS-e (Nota Fiscal Eletrônica de Serviços), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_pe_recife_nfs-mcp
repository: https://github.com/mcp-dir/pref_pe_recife_nfs-mcp

tags:
  - pref_pe_recife_nfs
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_pe_recife_nfs

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_pe_recife_nfs/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
